name: Source CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  cpu-tests:
    name: cpu-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run regression tests
        run: pytest tests/ --junitxml="$RUNNER_TEMP/test-results.xml"
      - name: Preserve test results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results.xml
          if-no-files-found: warn
          retention-days: 14

  model-contracts:
    name: model-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model-ci.txt
      - name: Install locked CPU model dependencies
        run: python -m pip install -r requirements-model-ci.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run required model contracts and synthetic workflow
        run: python tools/check_model_contracts.py

  source-integrity:
    name: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify source and frozen baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && "$EVENT_REF" != refs/heads/main ]]; then
            echo 'Manual readiness checks must run on main.' >&2
            exit 1
          fi
          args=(verify)
          if [[ -n "$BASE_REF" && ! "$BASE_REF" =~ ^0+$ ]]; then
            args+=(--base-ref "$BASE_REF")
          fi
          python tools/source_readiness.py "${args[@]}"

  release-readiness:
    name: release-readiness
    needs: [cpu-tests, source-integrity, model-contracts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MODEL_TEST_RESULT: ${{ needs.model-contracts.result }}
      CPU_TEST_RESULT: ${{ needs.cpu-tests.result }}
      SOURCE_INTEGRITY_RESULT: ${{ needs.source-integrity.result }}
    steps:
      - name: Require successful prerequisites
        run: |
          if [[ "$CPU_TEST_RESULT" != success || "$SOURCE_INTEGRITY_RESULT" != success || "$MODEL_TEST_RESULT" != success ]]; then
            echo "Readiness blocked: tests=$CPU_TEST_RESULT, integrity=$SOURCE_INTEGRITY_RESULT, models=$MODEL_TEST_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and verify the tested source archive
        run: |
          args=(package --output-dir "$RUNNER_TEMP/source-release"
            --cpu-test-result "$CPU_TEST_RESULT" --source-integrity-result "$SOURCE_INTEGRITY_RESULT"
            --model-test-result "$MODEL_TEST_RESULT")
          if [[ -n "$BASE_REF" && ! "$BASE_REF" =~ ^0+$ ]]; then
            args+=(--base-ref "$BASE_REF")
          fi
          python tools/source_readiness.py "${args[@]}"
          cd "$RUNNER_TEMP/source-release"
          sha256sum -c SHA256SUMS
          cat source-readiness.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the verified main source package
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-release/
          if-no-files-found: error
          retention-days: 14
